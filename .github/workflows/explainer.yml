name: explainer factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Explainer विषय (e.g. "भारतीय राज्यघटना — मूलभूत हक्क")'
        required: false
        default: 'महाराष्ट्राचे भूगोल'
      voice:
        description: 'Voice: manohar / aarohi / child (कोल्हापुर-मुलीसारखा) / mr-IN-*'
        required: false
        default: 'manohar'
      dialect:
        description: 'kolhapuri = narration कोल्हापुरी ग्रामीण बोलभाषेत / (blank) = प्रमाणभाषा'
        required: false
        default: ''
      no_quiz:
        description: 'Skip the quiz-bite interlude (true/false)'
        required: false
        default: 'false'
      preview:
        description: 'Preview mode (3 chapters, ~2 min)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          T: ${{ secrets.TG_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "skip=1" >> $GITHUB_OUTPUT; else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == '0'
        with:
          python-version: '3.11'

      - name: Install factory deps
        if: steps.check.outputs.skip == '0'
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          pip install pillow==12.3.0 edge-tts gtts requests==2.34.2 reportlab

      - name: Render explainer
        if: steps.check.outputs.skip == '0'
        timeout-minutes: 16
        env:
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_VOICE: ${{ github.event.inputs.voice }}
          IN_NQ: ${{ github.event.inputs.no_quiz }}
          IN_PREVIEW: ${{ github.event.inputs.preview }}
          IN_DIALECT: ${{ github.event.inputs.dialect }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: |
          ARGS=(--topic "$IN_TOPIC" --voice "$IN_VOICE" --script-cache out_explainer/script.json)
          if [ "$IN_NQ" = "true" ]; then ARGS+=(--no-quiz); fi
          if [ "$IN_PREVIEW" = "true" ]; then ARGS+=(--preview); fi
          if [ "$IN_DIALECT" = "kolhapuri" ]; then ARGS+=(--dialect kolhapuri); fi
          python3 tools/video_explainer.py "${ARGS[@]}"

      - name: Student notes PDF
        if: success() && steps.check.outputs.skip == '0'
        run: python3 tools/notes_gen.py out_explainer/script.json out_explainer/notes.pdf && ls -la out_explainer/notes.pdf

      - name: Upload explainer artifacts
        if: steps.check.outputs.skip == '0'
        uses: actions/upload-artifact@v4
        with:
          name: mmindpower-explainer-${{ github.run_number }}
          path: |
            out_explainer/final.mp4
            out_explainer/thumbnail.png
            out_explainer/meta.json
            out_explainer/notes.pdf
            out_explainer/script.json
          retention-days: 30

      - name: Notify owner via Telegram
        if: always() && steps.check.outputs.skip == '0'
        env:
          TG_ONE: ${{ secrets.TG_TOKEN }}
        run: |
          OWNER=7102918717
          if [ "${{ job.status }}" = "success" ]; then E="✅"; T="Explainer SUCCESS 🎓🎬 — script + mp4 + thumbnail on the run page:"; else E="❌"; T="Explainer failed — check run log:"; fi
          curl -s -X POST "https://api.telegram.org/bot$TG_ONE/sendMessage" \
            --data-urlencode "chat_id=$OWNER" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$E <b>$T</b>\n🎓 ${{ github.event.inputs.topic }}\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
