name: daily factory — रोजची शिकवण (autopilot)

on:
  schedule:
    - cron: '30 0 * * *'        # 06:00 IST every day
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          T: ${{ secrets.TG_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "skip=1" >> $GITHUB_OUTPUT; else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == '0'
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.check.outputs.skip == '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --upgrade pip -q
          pip install -q requests Pillow edge-tts gTTS reportlab

      - name: Pick today's topic (rotation over topics_bank.txt)
        id: pick
        run: |
          T=$(python3 -c "import datetime;b=[l.strip() for l in open('topics_bank.txt',encoding='utf-8') if l.strip()];i=(datetime.date.today().timetuple().tm_yday-1)%len(b);print(b[i])")
          echo "picked topic → $T"
          echo "topic=$T" >> $GITHUB_OUTPUT


      - name: Render FULL explainer (clean Aarohi voice, WITH quiz-bite)
        if: steps.check.outputs.skip == '0'
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: |
          rm -f out_explainer/script.json
          python3 tools/video_explainer.py --topic "${{ steps.pick.outputs.topic }}" --lang hinglish --script-cache out_explainer/script.json

      - name: Student notes PDF
        if: success() && steps.check.outputs.skip == '0'
        run: python3 tools/notes_gen.py out_explainer/script.json out_explainer/notes.pdf

      - name: 📨 Auto-post film + notes to Telegram (Rail 1)
        if: success() && steps.check.outputs.skip == '0'
        env:
          TG_ONE: ${{ secrets.TG_TOKEN }}
        run: |
          TARGET="-1004468993258"   # @mmindpower_1 channel numeric id (verified via getChat)
          TITLE=$(python3 -c "import json; print(json.load(open('out_explainer/final.mp4.meta.json' if False else 'out_explainer/meta.json'))['topic'])" 2>/dev/null || echo "${{ steps.pick.outputs.topic }}")
          GC=$(curl -s "https://api.telegram.org/bot$TG_ONE/getChat?chat_id=$TARGET")
          echo "getChat probe: $(echo "$GC" | head -c 250)"
          curl -s -X POST "https://api.telegram.org/bot$TG_ONE/sendMessage" -d "chat_id=$TARGET" --data-urlencode "text=🌅 Good morning स्ट्रайकर्स! आजची Hinglish फिल्म — $TITLE ⬇️" | head -c 200; echo
          R=$(curl -sS --max-time 280 -X POST "https://api.telegram.org/bot$TG_ONE/sendVideo" -F "chat_id=<$TARGET" -F "caption=<🎬 $TITLE — roz ki Hinglish seekh! Quiz-bite + FREE notes ⬇️ @mmindpower_1" -F "video=@out_explainer/final.mp4;type=video/mp4" -F "supports_streaming=true" 2>&1 || true)
          echo "sendVideo resp: $(echo "$R" | tail -c 300)"
          if ! echo "$R" | grep -q '"ok":true'; then
            echo "channel @mmindpower_1 post failed → DM fallback to owner"
            TARGET="7102918717"
            curl -sS --max-time 280 -X POST "https://api.telegram.org/bot$TG_ONE/sendVideo" -F "chat_id=<$TARGET" -F "caption=<🎬 $TITLE — daily film (channel post failed, DM mirror)" -F "video=@out_explainer/final.mp4;type=video/mp4" -F "supports_streaming=true" 2>&1 | tail -c 200 || true
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_ONE/sendDocument" -F "chat_id=<$TARGET" -F "document=@out_explainer/notes.pdf" -F "caption=<📝 $TITLE — आजची नोट्स" || true
          curl -sS -X POST "https://api.telegram.org/bot$TG_ONE/sendPhoto" -F "chat_id=<$TARGET" -F "photo=@out_explainer/thumbnail.png" -F "caption=<🏷️ thumbnail — YT साठी" || true

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip == '0'
        with:
          name: daily-${{ steps.pick.outputs.topic }}-${{ github.run_number }}
          path: |
            out_explainer/final.mp4
            out_explainer/thumbnail.png
            out_explainer/notes.pdf
            out_explainer/script.json
          retention-days: 7

      - name: Notify owner via Telegram
        if: always() && steps.check.outputs.skip == '0'
        env:
          TG_ONE: ${{ secrets.TG_TOKEN }}
        run: |
          OWNER=7102918717
          if [ "${{ job.status }}" = "success" ]; then E="✅"; T="DAILY FACTORY 🌅 — आजची शिकवण + नोट्स तयार:"; else E="❌"; T="Daily factory failed — check run log:"; fi
          curl -s -X POST "https://api.telegram.org/bot$TG_ONE/sendMessage" \
            --data-urlencode "chat_id=$OWNER" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$E <b>$T</b>\n🎓 ${{ steps.pick.outputs.topic }}\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
