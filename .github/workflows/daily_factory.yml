name: daily factory — रोजची शिकवण (autopilot)

on:
  schedule:
    - cron: '30 0 * * *'        # 06:00 IST every day
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          T: ${{ secrets.TG_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "skip=1" >> $GITHUB_OUTPUT; else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == '0'
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.check.outputs.skip == '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --upgrade pip -q
          pip install -q requests Pillow edge-tts gTTS reportlab

      - name: Pick TODAY'S modern-history seed (bank questions — film lane only)
        id: pick
        run: |
          python3 tools/pick_history_seed.py --out out_explainer/history_seed.json
          T=$(python3 -c "import json; print(json.load(open('out_explainer/history_seed.json'))['topic'])")
          echo "history seed → $T"
          echo "topic=$T" >> $GITHUB_OUTPUT
          SLUG="history-q$(date -u +%j)"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT


      - name: Render FULL explainer (clean Aarohi voice, WITH quiz-bite)
        if: steps.check.outputs.skip == '0'
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: |
          rm -f out_explainer/script.json
          python3 tools/video_explainer.py --topic "${{ steps.pick.outputs.topic }}" --seed-file out_explainer/history_seed.json --lang hinglish --style documentary --script-cache out_explainer/script.json

      - name: Student notes PDF
        if: success() && steps.check.outputs.skip == '0'
        run: python3 tools/notes_gen.py out_explainer/script.json out_explainer/notes.pdf

      - name: 📨 Auto-post film + notes to Telegram (Rail 1)
        if: success() && steps.check.outputs.skip == '0'
        env:
          TG_ONE: ${{ secrets.TG_TOKEN }}
        run: |
          TARGET="-1004468993258"   # @mmindpower_1 channel numeric id (verified via getChat)
          TITLE=$(python3 -c "import json; print(json.load(open('out_explainer/final.mp4.meta.json' if False else 'out_explainer/meta.json'))['topic'])" 2>/dev/null || echo "${{ steps.pick.outputs.topic }}")
          GC=$(curl -s "https://api.telegram.org/bot$TG_ONE/getChat?chat_id=$TARGET")
          echo "getChat probe: $(echo "$GC" | head -c 250)"
          curl -s -X POST "https://api.telegram.org/bot$TG_ONE/sendMessage" -d "chat_id=$TARGET" --data-urlencode "text=🌅 Good morning स्ट्रайकर्स! आजची Hinglish फिल्म — $TITLE ⬇️" | head -c 200; echo
          STYLE=$(python3 -c "import json;print(json.load(open('out_explainer/meta.json')).get('style',''))" 2>/dev/null || true)
          if [ "$STYLE" = "documentary" ]; then C2=""; else C2="$'\n'"⏭ Intro khatam: 0:26 baad se asli content | 🎯 Sawaal ke liye niche buttons dabao 👇""; fi
          R=$(curl -sS --max-time 280 -X POST "https://api.telegram.org/bot$TG_ONE/sendVideo" --form-string "chat_id=$TARGET" --form-string "caption=🎬 $TITLE — aaj ki DOCUMENTARY (narration-only · no quiz) | FREE notes ⬇️ channel: @mmindpower_1"$C2" -F "video=@out_explainer/final.mp4;type=video/mp4" -F "supports_streaming=true" 2>&1 || true)
          echo "sendVideo resp: $(echo "$R" | tail -c 300)"
          FILM_MSG=$(echo "$R" | python3 -c "import json,sys;print(json.load(sys.stdin).get('result',{}).get('message_id',''))" 2>/dev/null)
          if ! echo "$R" | grep -q '"ok":true'; then
            echo "channel @mmindpower_1 post failed → DM fallback to owner"
            TARGET="7102918717"
            curl -sS --max-time 280 -X POST "https://api.telegram.org/bot$TG_ONE/sendVideo" --form-string "chat_id=$TARGET" --form-string "caption=🎬 $TITLE — daily film (DM mirror)" -F "video=@out_explainer/final.mp4;type=video/mp4" -F "supports_streaming=true" 2>&1 | tail -c 200 || true
          fi
          QUIZ_MSG=""
          if [ -f out_explainer/final_quiz.mp4 ]; then
            QR=$(curl -sS --max-time 200 -X POST "https://api.telegram.org/bot$TG_ONE/sendVideo" --form-string "chat_id=$TARGET" --form-string "caption=🎯 Seedha SAWAAL — aaj ka quiz bite (film ka aakhri hissa): $TITLE" -F "video=@out_explainer/final_quiz.mp4;type=video/mp4" -F "supports_streaming=true" 2>&1 || true)
            QUIZ_MSG=$(echo "$QR" | python3 -c "import json,sys;print(json.load(sys.stdin).get('result',{}).get('message_id',''))" 2>/dev/null)
            echo "quiz clip msg: $QUIZ_MSG"
          fi
          BODY_MSG=""
          if [ -f out_explainer/final_body.mp4 ]; then
            BR=$(curl -sS --max-time 260 -X POST "https://api.telegram.org/bot$TG_ONE/sendVideo" --form-string "chat_id=$TARGET" --form-string "caption=⏭ Skip-Intro version — wahi film, intro ke baad se shuru: $TITLE" -F "video=@out_explainer/final_body.mp4;type=video/mp4" -F "supports_streaming=true" 2>&1 || true)
            BODY_MSG=$(echo "$BR" | python3 -c "import json,sys;print(json.load(sys.stdin).get('result',{}).get('message_id',''))" 2>/dev/null)
            echo "body clip msg: $BODY_MSG"
          fi
          python3 tools/tg_buttons.py "$TG_ONE" "$TARGET" "${FILM_MSG:--}" "${QUIZ_MSG:--}" "${BODY_MSG:--}" || true
          curl -sS -X POST "https://api.telegram.org/bot$TG_ONE/sendDocument" --form-string "chat_id=$TARGET" -F "document=@out_explainer/notes.pdf" --form-string "caption=📝 $TITLE — आजची नोट्स" || true
          curl -sS -X POST "https://api.telegram.org/bot$TG_ONE/sendPhoto" --form-string "chat_id=$TARGET" -F "photo=@out_explainer/thumbnail.png" --form-string "caption=🏷️ thumbnail — YT साठी" || true

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip == '0'
        with:
          name: daily-${{ steps.pick.outputs.slug }}-${{ github.run_number }}
          path: |
            out_explainer/final.mp4
            out_explainer/final_body.mp4
            out_explainer/final_quiz.mp4
            out_explainer/thumbnail.png
            out_explainer/notes.pdf
            out_explainer/script.json
          retention-days: 7

      - name: Notify owner via Telegram
        if: always() && steps.check.outputs.skip == '0'
        env:
          TG_ONE: ${{ secrets.TG_TOKEN }}
        run: |
          OWNER=7102918717
          if [ "${{ job.status }}" = "success" ]; then E="✅"; T="DAILY FACTORY 🌅 — आजची शिकवण + नोट्स तयार:"; else E="❌"; T="Daily factory failed — check run log:"; fi
          curl -s -X POST "https://api.telegram.org/bot$TG_ONE/sendMessage" \
            --data-urlencode "chat_id=$OWNER" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$E <b>$T</b>\n🎓 ${{ steps.pick.outputs.topic }}\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
