name: host film — AI talking-host vertical documentary

on:
  workflow_dispatch:
    inputs:
      script_text:
        description: 'Hindi narration script (used verbatim). Leave empty to use committed host_input/script.txt'
        required: false
        type: string

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ffmpeg unzip
          pip install -q edge-tts pillow mutagen imageio-ffmpeg requests
      - name: script input
        env:
          SCRIPT_TEXT: ${{ inputs.script_text }}
        run: |
          mkdir -p host_input
          if [ -n "$SCRIPT_TEXT" ]; then
            printf '%s' "$SCRIPT_TEXT" > host_input/script.txt
          fi
          test -s host_input/script.txt || (echo "NO SCRIPT PROVIDED" && exit 1)
          wc -c host_input/script.txt
      - name: build host film
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 tools/host_film.py --script host_input/script.txt --out out_host --scenes 10
          ls -la out_host/
      - name: post to channel
        run: |
          python3 - <<'PY'
          import os, requests
          bt, chat = os.environ["TG_BOT_TOKEN"], os.environ.get("TG_CHAT_ID") or "@mmindpower_1"
          with open("out_host/host_film.mp4", "rb") as f:
              r = requests.post(f"https://api.telegram.org/bot{bt}/sendVideo",
                                data={"chat_id": chat, "width": 720, "height": 1280,
                                      "caption": "📱 AI-host documentary — प्रतापगढ़ | vertical • lip-synced host | @mmindpower_1",
                                      "supports_streaming": "true"},
                                files={"video": f}, timeout=900)
          print(r.json())
          PY
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: notify owner
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=7102918717" --data-urlencode "text=AI-host film run finished: ${{ job.status }} → https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-film-${{ github.run_number }}
          path: out_host/host_film.mp4
          if-no-files-found: warn
          retention-days: 7
