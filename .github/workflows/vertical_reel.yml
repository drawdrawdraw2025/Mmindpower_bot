name: vertical reel — Disney-type animated doc (weekly + manual)

on:
  schedule:
    - cron: '35 1 * * 0'        # Sunday 07:05 IST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          T: ${{ secrets.TG_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "skip=1" >> $GITHUB_OUTPUT; else echo "skip=0" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == '0'
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.check.outputs.skip == '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --upgrade pip -q
          pip install -q requests Pillow edge-tts gTTS mutagen

      - name: Pick reel seed (offset — never doubles the daily film)
        if: steps.check.outputs.skip == '0'
        run: |
          python3 tools/pick_history_seed.py --out out_vertical/vseed.json --offset 163

      - name: Render VERTICAL animated documentary (multi-agent)
        if: steps.check.outputs.skip == '0'
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: |
          rm -f out_vertical/vscript.json
          python3 tools/vertical_agent.py --topic "$(python3 -c "import json;print(json.load(open('out_vertical/vseed.json'))['topic'])")" --seed-file out_vertical/vseed.json --chapters 7 --scenes-per-chapter 6

      - name: Post reel to channel
        if: success() && steps.check.outputs.skip == '0'
        env:
          TG_ONE: ${{ secrets.TG_TOKEN }}
        run: |
          TARGET="-1004468993258"
          TITLE=$(python3 -c "import json;print(json.load(open('out_vertical/vmeta.json'))['topic'])" 2>/dev/null || echo "Documentary Reel")
          MINS=$(python3 -c "import json;print(json.load(open('out_vertical/vmeta.json'))['minutes'])" 2>/dev/null || echo "")
          curl -sS --max-time 280 -X POST "https://api.telegram.org/bot$TG_ONE/sendVideo" --form-string "chat_id=$TARGET" --form-string "caption=📱 $TITLE — VERTICAL animated documentary (${MINS} min, full-screen phone friendly!) | channel: @mmindpower_1" -F "video=@out_vertical/vertical.mp4;type=video/mp4" -F "supports_streaming=true" 2>&1 | tail -c 220 || true

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip == '0'
        with:
          name: vertical-reel-${{ github.run_number }}
          path: |
            out_vertical/vertical.mp4
            out_vertical/vmeta.json
            out_vertical/vscript.json
          retention-days: 7

      - name: Notify owner
        if: always() && steps.check.outputs.skip == '0'
        env:
          TG_ONE: ${{ secrets.TG_TOKEN }}
        run: |
          OWNER=7102918717
          if [ "${{ job.status }}" = "success" ]; then E="✅"; T="VERTICAL REEL ready:"; else E="❌"; T="Vertical reel failed:"; fi
          curl -s -X POST "https://api.telegram.org/bot$TG_ONE/sendMessage" \
            --data-urlencode "chat_id=$OWNER" \
            --data-urlencode "text=$E $T 🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
