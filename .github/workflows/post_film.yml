name: post film — publish any mp4 release asset to channel

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct mp4 URL (e.g. a GitHub Release asset link)'
        required: true
        type: string
      caption:
        description: 'Telegram caption'
        required: false
        type: string
        default: '📱 AI-host documentary | @mmindpower_1'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: fetch video
        run: |
          curl -sfL "${{ inputs.video_url }}" -o film.mp4
          ls -la film.mp4
      - name: send to channel
        run: |
          python3 - <<'PY'
          import os, requests
          bt, chat = os.environ["TG_BOT_TOKEN"], os.environ.get("TG_CHAT_ID") or "@mmindpower_1"
          with open("film.mp4", "rb") as f:
              r = requests.post(f"https://api.telegram.org/bot{bt}/sendVideo",
                                data={"chat_id": chat, "width": 720, "height": 1280,
                                      "caption": os.environ.get("CAP") or "📱 AI-host documentary | @mmindpower_1",
                                      "supports_streaming": "true"},
                                files={"video": f}, timeout=900)
          print(r.json())
          PY
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CAP: ${{ inputs.caption }}
      - name: notify owner
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" --data-urlencode "chat_id=7102918717" --data-urlencode "text=post_film run: ${{ job.status }}" || true
